gateway:
  id: "gw-01"

http:
  addr: ":8080"

# API 鉴权(默认启用;管理员由数据库预置,首次登录强制改密)
# auth:
#   enabled: true      # 显式 false 关闭鉴权(逃生舱)
#   sessionTtl: "24h"  # 管理员会话有效期

# 北向输出已迁移到 SQLite,通过 Web UI 配置(无需写在 yaml 里)。
# 下方 mqtt / thingsboard / tdengine 段仅在「旧版本升级」时用于一次性迁移:
# 首次启动时若输出表为空且下方有配置,会自动导入 SQLite 并标记迁移完成,
# 之后一律以 Web UI 中的配置为准,改 yaml 不再生效。
# mqtt:
#   broker: "tcp://127.0.0.1:1883"
#   clientId: "iot-gateway-gw-01"
#   qos: 1
#
# # ThingsBoard 平台对接
# thingsboard:
#   broker: "tcp://tb.example.com:1883"
#   accessToken: "gateway-access-token"
#   clientId: "iot-gateway-tb"
#   qos: 1
#   deviceNamePrefix: ""
#   reportQuality: true
#   flushInterval: "200ms"
#
# # TDengine 时序库对接
# tdengine:
#   url: "http://127.0.0.1:6041"
#   username: "root"
#   password: "taosdata"
#   database: "iot_gateway"
#   stable: "data_points"
#   flushInterval: "1s"

storage:
  sqlitePath: "./gateway.db"

scheduler:
  poolSize: 16

log:
  level: info          # debug/info/warn/error
  format: text         # text/json
  file:
    path: "./logs/gateway.log"  # 留空则只输出 stdout
    maxSize: 100       # MB,单文件超过则轮转
    maxBackups: 7      # 保留旧日志文件数
    maxAge: 30         # 保留天数
    compress: true     # 旧文件 gzip 压缩
