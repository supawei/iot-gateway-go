gateway:
  id: "gw-01"

http:
  addr: ":8080"

# API 鉴权(默认启用;管理员由数据库预置,首次登录强制改密)
# auth:
#   enabled: true      # 显式 false 关闭鉴权(逃生舱)
#   sessionTtl: "24h"  # 管理员会话有效期

mqtt:
  broker: "tcp://127.0.0.1:1883"
  clientId: "iot-gateway-gw-01"
  qos: 1

# ThingsBoard 平台对接(可选;配置 broker + accessToken 后启用)
# thingsboard:
#   broker: "tcp://tb.example.com:1883"
#   accessToken: "gateway-access-token"
#   clientId: "iot-gateway-tb"
#   qos: 1
#   deviceNamePrefix: ""   # 子设备名前缀,默认空
#   reportQuality: true    # 是否上报 quality 属性,默认 true
#   flushInterval: "200ms" # 微批聚合 flush 间隔,默认 200ms

# TDengine 时序库对接(可选;配置 url 后启用,经 taosAdapter REST 写入)
# tdengine:
#   url: "http://127.0.0.1:6041"  # taosAdapter REST 地址
#   username: "root"               # 默认 root
#   password: "taosdata"           # 默认 taosdata
#   database: "iot_gateway"        # 库名,默认 iot_gateway
#   stable: "data_points"          # 超级表名,默认 data_points
#   flushInterval: "1s"            # 微批聚合 flush 间隔,默认 1s

storage:
  sqlitePath: "./gateway.db"

scheduler:
  poolSize: 16

log:
  level: info          # debug/info/warn/error
  format: text         # text/json
  file:
    path: "./logs/gateway.log"  # 留空则只输出 stdout
    maxSize: 100       # MB,单文件超过则轮转
    maxBackups: 7      # 保留旧日志文件数
    maxAge: 30         # 保留天数
    compress: true     # 旧文件 gzip 压缩
