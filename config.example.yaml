# 网关 ID 已迁移到 SQLite(默认 iot-gateway),经 Web UI「概览」页修改,不在 yaml 里。

http:
  addr: ":8080"

# API 鉴权(默认启用;管理员由数据库预置,首次登录强制改密)
# auth:
#   enabled: true      # 显式 false 关闭鉴权(逃生舱)
#   sessionTtl: "24h"  # 管理员会话有效期

# 北向输出(MQTT / ThingsBoard / TDengine)通过 Web UI 配置,存 SQLite,不在 yaml 里。

storage:
  sqlitePath: "./gateway.db"
  # backfillMax: 100000   # 断网补传队列上限(每条输出),超过淘汰最旧数据,防磁盘无限增长

scheduler:
  poolSize: 16

log:
  level: info          # debug/info/warn/error
  format: text         # text/json
  file:
    path: "./logs/gateway.log"  # 留空则只输出 stdout
    maxSize: 100       # MB,单文件超过则轮转
    maxBackups: 7      # 保留旧日志文件数
    maxAge: 30         # 保留天数
    compress: true     # 旧文件 gzip 压缩
